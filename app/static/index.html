<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papelería PIA</title>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body>

  <!-- Inicio de sesión -->
  <section id="vista-login" class="login" hidden>
    <form id="form-login" class="tarjeta">
      <h1>Papelería PIA</h1>
      <p class="sutil">Inicia sesión para continuar</p>
      <label>Correo <input name="correo" type="email" required autocomplete="username"></label>
      <label>Contraseña <input name="contrasena" type="password" required autocomplete="current-password"></label>
      <button type="submit">Entrar</button>
      <p class="sutil">¿No tienes cuenta? <a href="#" id="link-registro">Regístrate</a></p>
    </form>

    <form id="form-registro" class="tarjeta" hidden>
      <h1>Crear cuenta</h1>
      <label>Nombre <input name="nombre" required></label>
      <label>Correo <input name="correo" type="email" required></label>
      <label>Contraseña <input name="contrasena" type="password" required minlength="8"></label>
      <button type="submit">Registrarme</button>
      <p class="sutil"><a href="#" id="link-login">Ya tengo cuenta</a></p>
    </form>
  </section>

  <!-- Aplicación -->
  <div id="vista-app" hidden>
    <header class="barra">
      <strong>Papelería PIA</strong>
      <nav id="menu">
        <button data-seccion="productos">Productos</button>
        <button data-seccion="ventas">Ventas</button>
        <button data-seccion="clientes">Clientes</button>
        <button data-seccion="categorias" class="solo-admin">Categorías</button>
        <button data-seccion="proveedores" class="solo-admin">Proveedores</button>
        <button data-seccion="compras" class="solo-admin">Compras</button>
        <button data-seccion="usuarios" class="solo-admin">Usuarios</button>
      </nav>
      <span class="usuario"><span id="nombre-usuario"></span> <button id="btn-salir" class="secundario">Salir</button></span>
    </header>

    <main>
      <!-- Productos -->
      <section data-vista="productos">
        <h2>Productos</h2>
        <form id="form-producto" class="tarjeta fila solo-admin">
          <input type="hidden" name="id">
          <input name="nombre" placeholder="Nombre" required minlength="2">
          <input name="descripcion" placeholder="Descripción">
          <input name="precio" type="number" step="0.01" min="0.01" placeholder="Precio" required>
          <input name="stock" type="number" min="0" placeholder="Stock" required>
          <input name="stock_minimo" type="number" min="0" placeholder="Stock mín." value="5">
          <select name="categoria_id" required data-opciones="categorias"></select>
          <button type="submit">Guardar</button>
          <button type="button" class="secundario" id="cancelar-edicion" hidden>Cancelar</button>
        </form>
        <div class="tabla" id="tabla-productos"></div>
      </section>

      <!-- Ventas -->
      <section data-vista="ventas">
        <h2>Ventas</h2>
        <form id="form-venta" class="tarjeta">
          <label>Cliente (opcional) <select name="cliente_id" data-opciones="clientes" data-vacio="Público general"></select></label>
          <div class="partidas"></div>
          <div class="fila">
            <button type="button" class="secundario" data-agregar-partida>+ Producto</button>
            <button type="submit">Registrar venta</button>
          </div>
        </form>
        <form id="filtro-ventas" class="fila">
          <label>Desde <input type="date" name="fecha_inicio"></label>
          <label>Hasta <input type="date" name="fecha_fin"></label>
          <button type="submit" class="secundario">Filtrar</button>
        </form>
        <div class="tabla" id="tabla-ventas"></div>
      </section>

      <!-- Clientes -->
      <section data-vista="clientes">
        <h2>Clientes</h2>
        <form id="form-cliente" class="tarjeta fila">
          <input name="nombre" placeholder="Nombre" required>
          <input name="correo" type="email" placeholder="Correo">
          <input name="telefono" placeholder="Teléfono">
          <button type="submit">Agregar</button>
        </form>
        <div class="tabla" id="tabla-clientes"></div>
      </section>

      <!-- Categorías -->
      <section data-vista="categorias">
        <h2>Categorías</h2>
        <form id="form-categoria" class="tarjeta fila">
          <input name="nombre" placeholder="Nombre" required>
          <input name="descripcion" placeholder="Descripción">
          <button type="submit">Agregar</button>
        </form>
        <div class="tabla" id="tabla-categorias"></div>
      </section>

      <!-- Proveedores -->
      <section data-vista="proveedores">
        <h2>Proveedores</h2>
        <form id="form-proveedor" class="tarjeta fila">
          <input name="nombre" placeholder="Nombre" required>
          <input name="contacto" placeholder="Contacto">
          <input name="telefono" placeholder="Teléfono">
          <input name="correo" type="email" placeholder="Correo">
          <button type="submit">Agregar</button>
        </form>
        <div class="tabla" id="tabla-proveedores"></div>
      </section>

      <!-- Compras -->
      <section data-vista="compras">
        <h2>Compras</h2>
        <form id="form-compra" class="tarjeta">
          <label>Proveedor <select name="proveedor_id" required data-opciones="proveedores"></select></label>
          <div class="partidas" data-con-costo></div>
          <div class="fila">
            <button type="button" class="secundario" data-agregar-partida>+ Producto</button>
            <button type="submit">Registrar compra</button>
          </div>
        </form>
        <div class="tabla" id="tabla-compras"></div>
      </section>

      <!-- Usuarios -->
      <section data-vista="usuarios">
        <h2>Usuarios</h2>
        <form id="form-usuario" class="tarjeta fila">
          <input name="nombre" placeholder="Nombre" required>
          <input name="correo" type="email" placeholder="Correo" required>
          <input name="contrasena" type="password" placeholder="Contraseña" required minlength="8">
          <span class="sutil">Se crea como administrador</span>
          <button type="submit">Crear admin</button>
        </form>
        <div class="tabla" id="tabla-usuarios"></div>
      </section>
    </main>
  </div>

  <div id="aviso" hidden></div>

  <script src="/ui/app.js"></script>
</body>
</html>
